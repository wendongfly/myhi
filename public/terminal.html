<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.png">
  <title>myhi 终端</title>
  <script src="/lib/machine.js" data-session></script>
  <link rel="stylesheet" href="/lib/xterm/css/xterm.css">
  <script src="/lib/xterm/lib/xterm.js"></script>
  <script src="/lib/xterm-fit/lib/xterm-addon-fit.js"></script>
  <script src="/lib/xterm-links/lib/xterm-addon-web-links.js"></script>
  <script src="/sio-client/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
      gap: 0.5rem;
      padding-top: max(0.5rem, env(safe-area-inset-top));
    }

    #session-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #58a6ff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    #viewer-count {
      font-size: 0.75rem;
      color: #8b949e;
      white-space: nowrap;
    }

    .top-btn {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.3rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .top-btn:hover { background: #30363d; }

    /* ── Tab bar ── */
    #tab-bar {
      display: flex;
      align-items: center;
      background: #0d1117;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    #tab-bar::-webkit-scrollbar { display: none; }

    .tab {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.75rem;
      font-size: 0.78rem;
      color: #8b949e;
      background: transparent;
      border: none;
      border-right: 1px solid #21262d;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }
    .tab:hover { color: #e6edf3; background: #161b22; }
    .tab.active {
      color: #e6edf3;
      background: #161b22;
      border-bottom: 2px solid #7c3aed;
    }
    .tab .tab-close {
      font-size: 0.7rem;
      color: #6e7681;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0 0.15rem;
      border-radius: 3px;
      line-height: 1;
    }
    .tab .tab-close:hover { color: #f85149; background: #21262d; }
    .tab .tab-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #3fb950;
      flex-shrink: 0;
    }
    .tab .tab-dot.dead { background: #f85149; }

    #tab-add {
      background: none;
      border: none;
      color: #6e7681;
      font-size: 1.1rem;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    #tab-add:hover { color: #e6edf3; }

    /* ── Terminal area ── */
    #terminal-wrapper {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .term-pane {
      position: absolute;
      inset: 0;
      padding: 4px;
      display: none;
    }
    .term-pane.active { display: block; }

    /* Mobile shortcut bar */
    #shortcut-bar {
      display: flex;
      align-items: center;
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 0.4rem 0.5rem;
      padding-bottom: max(0.4rem, env(safe-area-inset-bottom));
      gap: 0.4rem;
      overflow-x: auto;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #shortcut-bar::-webkit-scrollbar { display: none; }

    .sk {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
      font-family: 'SF Mono', 'Consolas', monospace;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .sk:active { background: #30363d; transform: scale(0.95); }

    /* QR modal */
    #qr-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #qr-modal.open { display: flex; }
    #qr-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      max-width: 320px;
      width: 90%;
    }
    #qr-box h3 { margin-bottom: 1rem; font-size: 0.95rem; }
    #qr-box img { width: 100%; max-width: 240px; border-radius: 8px; background: #fff; padding: 8px; }
    #qr-box .close-btn {
      margin-top: 1rem;
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.5rem 1.5rem;
      cursor: pointer;
      font-size: 0.9rem;
    }

    #status-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(13,17,23,0.85);
      color: #8b949e;
      font-size: 0.9rem;
      z-index: 10;
    }
    #status-overlay.hidden { display: none; }

    /* ── 文件管理面板 ── */
    #file-panel-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 59; display: none; }
    #file-panel-backdrop.open { display: block; }
    #file-panel {
      position: fixed; top: 0; right: -340px; width: 320px; max-width: 90vw; height: 100%;
      background: #161b22; border-left: 1px solid #30363d; z-index: 60;
      transition: right 0.25s ease; display: flex; flex-direction: column;
    }
    #file-panel.open { right: 0; }
    .fp-header { display: flex; align-items: center; padding: 0.75rem; border-bottom: 1px solid #30363d; gap: 0.5rem; flex-shrink: 0; }
    .fp-header h3 { flex: 1; font-size: 0.9rem; margin: 0; color: #e6edf3; }
    .fp-btn { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 0.75rem; cursor: pointer; }
    .fp-btn:active { background: #30363d; }
    .fp-path { padding: 0.4rem 0.75rem; font-size: 0.7rem; color: #8b949e; border-bottom: 1px solid #21262d; word-break: break-all; flex-shrink: 0; }
    .fp-list { flex: 1; overflow-y: auto; padding: 0.25rem 0; }
    .fp-item { display: flex; align-items: center; padding: 0.5rem 0.75rem; gap: 0.5rem; cursor: pointer; font-size: 0.82rem; color: #e6edf3; }
    .fp-item:active { background: #21262d; }
    .fp-item .fp-icon { width: 1.2rem; text-align: center; flex-shrink: 0; }
    .fp-item .fp-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fp-item .fp-size { color: #8b949e; font-size: 0.7rem; white-space: nowrap; }
    .fp-item .fp-dl { color: #58a6ff; font-size: 0.7rem; text-decoration: none; padding: 0.2rem 0.4rem; }
    .fp-empty { text-align: center; color: #8b949e; padding: 2rem 0.75rem; font-size: 0.85rem; }
    .fp-drop-zone {
      margin: 0.5rem 0.75rem; padding: 1.5rem; border: 2px dashed #30363d; border-radius: 8px;
      text-align: center; color: #8b949e; font-size: 0.8rem; flex-shrink: 0;
      transition: border-color 0.2s, background 0.2s;
    }
    .fp-drop-zone.dragover { border-color: #58a6ff; background: rgba(88,166,255,0.08); }
    .fp-progress { padding: 0.4rem 0.75rem; font-size: 0.75rem; color: #d29922; flex-shrink: 0; display: none; }
    .fp-sync-bar { display: flex; gap: 0.4rem; padding: 0.5rem 0.75rem; border-bottom: 1px solid #21262d; flex-shrink: 0; align-items: center; flex-wrap: wrap; }
    .fp-sync-bar .fp-btn { font-size: 0.7rem; padding: 0.25rem 0.5rem; }
    .fp-sync-bar .sync-dir { font-size: 0.68rem; color: #8b949e; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .fp-diff-item { display: flex; align-items: center; padding: 0.4rem 0.75rem; gap: 0.4rem; font-size: 0.78rem; color: #e6edf3; }
    .fp-diff-item .badge { font-size: 0.65rem; padding: 0.1rem 0.35rem; border-radius: 4px; font-weight: 600; flex-shrink: 0; }
    .badge-new { background: #238636; color: #fff; }
    .badge-changed { background: #9e6a03; color: #fff; }
    .badge-arrow { color: #8b949e; flex-shrink: 0; font-size: 0.7rem; }
    .fp-diff-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fp-diff-summary { padding: 0.75rem; text-align: center; color: #8b949e; font-size: 0.8rem; }
    .fp-diff-actions { display: flex; gap: 0.5rem; padding: 0.5rem 0.75rem; flex-shrink: 0; }
    .fp-diff-actions .fp-btn { flex: 1; text-align: center; padding: 0.45rem; }
    .fp-btn-primary { background: #238636; border-color: #2ea04380; }
    .fp-btn-primary:active { background: #2ea043; }
    .fp-btn-warn { background: #9e6a03; border-color: #d2992280; }
    .fp-btn-warn:active { background: #bb8009; }
  </style>
</head>
<body>

  <div id="top-bar">
    <div id="session-title">加载中...</div>
    <span id="viewer-count"></span>
    <button class="top-btn" onclick="openFilePanel()">文件</button>
    <button class="top-btn" onclick="showQR()">扫码分享</button>
    <button class="top-btn" onclick="goBack()">← 返回</button>
    <button class="top-btn" id="logout-btn" onclick="doLogout()" style="display:none;color:#f0883e">退出</button>
  </div>

  <!-- Tab bar -->
  <div id="tab-bar">
    <button id="tab-add" onclick="addTab()" title="新建标签页">+</button>
  </div>

  <div id="terminal-wrapper"></div>

  <!-- Mobile shortcut bar -->
  <div id="shortcut-bar">
    <button class="sk" id="btn-photo" onclick="openCamera()" style="color:#7c3aed;border-color:#7c3aed33;background:#7c3aed11">📷</button>
    <button class="sk" data-send="ctrl-c">Ctrl+C</button>
    <button class="sk" data-send="ctrl-d">Ctrl+D</button>
    <button class="sk" data-send="tab">Tab</button>
    <button class="sk" data-send="up">↑</button>
    <button class="sk" data-send="down">↓</button>
    <button class="sk" data-send="right">→</button>
    <button class="sk" data-send="left">←</button>
    <button class="sk" data-send="esc">Esc</button>
    <button class="sk" data-send="ctrl-a">Ctrl+A</button>
    <button class="sk" data-send="ctrl-e">Ctrl+E</button>
    <button class="sk" data-send="ctrl-k">Ctrl+K</button>
    <button class="sk" data-send="ctrl-u">Ctrl+U</button>
    <button class="sk" data-send="ctrl-r">Ctrl+R</button>
    <button class="sk" data-send="alt-.">Alt+.</button>
  </div>

  <!-- 文件管理面板 -->
  <div id="file-panel-backdrop" onclick="closeFilePanel()"></div>
  <div id="file-panel">
    <div class="fp-header">
      <h3 id="fp-title">文件管理</h3>
      <button class="fp-btn" onclick="fpUploadClick()">上传</button>
      <button class="fp-btn" onclick="fpStartSync()">同步</button>
      <button class="fp-btn" onclick="closeFilePanel()">关闭</button>
    </div>
    <div class="fp-sync-bar" id="fp-sync-bar" style="display:none">
      <span class="sync-dir" id="fp-sync-dir"></span>
      <button class="fp-btn" onclick="fpPickDir()">换目录</button>
      <button class="fp-btn" onclick="fpExitSync()">退出同步</button>
    </div>
    <div class="fp-path" id="fp-path"></div>
    <div class="fp-list" id="fp-list"></div>
    <div class="fp-diff-actions" id="fp-diff-actions" style="display:none">
      <button class="fp-btn fp-btn-primary" onclick="fpSyncToLocal()">下载到本地</button>
      <button class="fp-btn fp-btn-warn" onclick="fpSyncToServer()">上传到服务器</button>
    </div>
    <div class="fp-progress" id="fp-progress"></div>
    <div class="fp-drop-zone" id="fp-drop">拖拽文件到此处上传，或点击上方按钮</div>
    <input type="file" id="fp-file-input" multiple style="display:none">
  </div>

  <!-- QR modal -->
  <div id="qr-modal">
    <div id="qr-box">
      <h3>扫码在其他设备打开此终端</h3>
      <img id="qr-img" src="" alt="QR Code">
      <br>
      <button class="close-btn" onclick="closeQR()">关闭</button>
    </div>
  </div>

  <script>
    // 加载用户信息（独占模式显示退出按钮）
    fetch('/api/me').then(r => r.json()).then(data => {
      if (data.exclusive || data.hasUsers) document.getElementById('logout-btn').style.display = '';
    }).catch(() => {});
    function doLogout() {
      if (!confirm('确定退出登录？')) return;
      try { for (const t of Object.values(tabs)) t.socket?.disconnect(); } catch {}
      fetch('/logout', { method: 'POST' }).then(() => { location.href = '/login'; });
    }

    // ── Tab 管理 ─────────────────────────────────────────────
    const TERM_THEME = {
      background: '#0d1117', foreground: '#e6edf3', cursor: '#58a6ff',
      selectionBackground: '#264f78',
      black: '#0d1117', red: '#ff7b72', green: '#3fb950', yellow: '#d29922',
      blue: '#58a6ff', magenta: '#bc8cff', cyan: '#39c5cf', white: '#e6edf3',
      brightBlack: '#6e7681', brightRed: '#ffa198', brightGreen: '#56d364',
      brightYellow: '#e3b341', brightBlue: '#79c0ff', brightMagenta: '#d2a8ff',
      brightCyan: '#56d4dd', brightWhite: '#f0f6fc',
    };

    const tabs = [];       // { id, sessionId, title, term, fitAddon, socket, pane, tabEl, alive }
    let activeTabId = null;

    const tabBar = document.getElementById('tab-bar');
    const tabAddBtn = document.getElementById('tab-add');
    const wrapper = document.getElementById('terminal-wrapper');

    // 从 URL 获取初始会话 ID
    const pathParts = location.pathname.split('/');
    const INIT_SESSION_ID = pathParts[pathParts.length - 1];

    // ── 创建 Tab ──
    function createTab(sessionId) {
      const id = Date.now() + '-' + Math.random().toString(36).slice(2, 6);

      // 创建终端容器
      const pane = document.createElement('div');
      pane.className = 'term-pane';
      wrapper.appendChild(pane);

      // 创建 xterm
      const term = new Terminal({
        theme: TERM_THEME,
        fontFamily: "'SF Mono', 'Cascadia Code', 'Consolas', 'Menlo', monospace",
        fontSize: 14, lineHeight: 1.2, cursorBlink: true,
        allowTransparency: false, scrollback: 5000,
      });
      const fitAddon = new FitAddon.FitAddon();
      const webLinksAddon = new WebLinksAddon.WebLinksAddon();
      term.loadAddon(fitAddon);
      term.loadAddon(webLinksAddon);
      term.open(pane);

      // 创建 Socket 连接
      const socket = io({
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 10000,
        timeout: 30000,
      });

      const tab = { id, sessionId, title: '连接中...', term, fitAddon, socket, pane, tabEl: null, alive: true };
      tabs.push(tab);

      // Tab 按钮
      renderTab(tab);

      // Socket 事件
      socket.on('connect', () => {
        socket.emit('join', sessionId);
      });

      socket.on('joined', (session) => {
        tab.title = session.title || 'shell';
        tab.alive = session.alive !== false;
        renderTab(tab);
        if (activeTabId === id) {
          updateTopBar(tab);
          fitTab(tab);
        }
      });

      socket.on('output', (data) => {
        term.write(data);
      });

      socket.on('kicked', ({ reason }) => { alert(reason || '你已被管理员踢出'); location.href = '/'; });

      socket.on('session-exit', ({ code }) => {
        tab.alive = false;
        tab.title = (tab.title || 'shell') + ' (已退出)';
        renderTab(tab);
        if (activeTabId === id) updateTopBar(tab);
      });

      socket.on('sessions', (sessions) => {
        const s = sessions.find(x => x.id === sessionId);
        if (s && activeTabId === id) {
          document.getElementById('viewer-count').textContent = s.viewers > 1 ? `👁 ${s.viewers}` : '';
        }
      });

      socket.on('disconnect', () => {
        // 显示断连提示
        term.write('\r\n\x1b[33m[myhi] 连接已断开，正在重连...\x1b[0m\r\n');
      });

      // 终端输入
      term.onData((data) => {
        socket.emit('input', data);
      });

      // 点击终端获取焦点
      pane.addEventListener('click', () => term.focus());

      return tab;
    }

    // ── 渲染 Tab 按钮 ──
    function renderTab(tab) {
      if (tab.tabEl) tab.tabEl.remove();

      const el = document.createElement('div');
      el.className = 'tab' + (activeTabId === tab.id ? ' active' : '');
      el.innerHTML = `<span class="tab-dot${tab.alive ? '' : ' dead'}"></span>` +
        `<span style="overflow:hidden;text-overflow:ellipsis">${esc(tab.title)}</span>` +
        `<button class="tab-close" title="关闭">&times;</button>`;

      el.addEventListener('click', (e) => {
        if (e.target.classList.contains('tab-close')) {
          closeTab(tab.id);
        } else {
          switchTab(tab.id);
        }
      });

      tab.tabEl = el;
      tabBar.insertBefore(el, tabAddBtn);
    }

    // ── 切换 Tab ──
    function switchTab(id) {
      activeTabId = id;
      tabs.forEach(t => {
        const isActive = t.id === id;
        t.pane.classList.toggle('active', isActive);
        if (t.tabEl) t.tabEl.classList.toggle('active', isActive);
      });
      const tab = tabs.find(t => t.id === id);
      if (tab) {
        updateTopBar(tab);
        fitTab(tab);
        tab.term.focus();
      }
    }

    // ── 关闭 Tab ──
    function closeTab(id) {
      const idx = tabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      const tab = tabs[idx];

      // 断开连接
      tab.socket.disconnect();
      tab.term.dispose();
      tab.pane.remove();
      if (tab.tabEl) tab.tabEl.remove();
      tabs.splice(idx, 1);

      if (tabs.length === 0) {
        window.location.href = '/';
        return;
      }

      // 切换到相邻 tab
      if (activeTabId === id) {
        const next = tabs[Math.min(idx, tabs.length - 1)];
        switchTab(next.id);
      }
    }

    // ── 新建 Tab（弹出会话选择）──
    async function addTab() {
      try {
        const res = await fetch('/api/sessions');
        const sessions = await res.json();
        const alive = sessions.filter(s => s.alive && s.mode !== 'agent');

        if (alive.length === 0) {
          alert('没有可用的终端会话，请先在首页创建');
          return;
        }

        // 过滤掉已打开的会话
        const opened = new Set(tabs.map(t => t.sessionId));
        const available = alive.filter(s => !opened.has(s.id));

        if (available.length === 0) {
          alert('所有会话已在标签页中打开');
          return;
        }

        if (available.length === 1) {
          // 只有一个，直接打开
          const tab = createTab(available[0].id);
          switchTab(tab.id);
          return;
        }

        // 多个可选：简单弹窗选择
        const names = available.map((s, i) => `${i + 1}. ${s.title}`).join('\n');
        const choice = prompt(`选择要打开的会话:\n\n${names}\n\n输入编号:`);
        if (!choice) return;
        const n = parseInt(choice, 10) - 1;
        if (n >= 0 && n < available.length) {
          const tab = createTab(available[n].id);
          switchTab(tab.id);
        }
      } catch (e) {
        alert('获取会话列表失败: ' + e.message);
      }
    }

    // ── 辅助函数 ──
    function fitTab(tab) {
      requestAnimationFrame(() => {
        try { tab.fitAddon.fit(); } catch {}
        if (tab.socket.connected) {
          tab.socket.emit('resize', { cols: tab.term.cols, rows: tab.term.rows });
        }
      });
    }

    function updateTopBar(tab) {
      document.getElementById('session-title').textContent = tab.title;
      document.title = tab.title + ' — myhi';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
    // 内联事件属性 onclick="f('${jsq(x)}')" 专用：先按 JS 单引号字符串转义，再按 HTML 属性转义。
    // 只做 HTML 转义不够 —— 浏览器先把 &#39; 解码回 ' 再交给 JS，文件名 / 技能名里带 ' 就能跳出字符串执行代码
    function jsq(s) { return String(s ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, '\\n').replace(/[\u2028\u2029]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    // 窗口 resize 时 fit 当前 tab
    window.addEventListener('resize', () => {
      const tab = tabs.find(t => t.id === activeTabId);
      if (tab) fitTab(tab);
    });

    // ── 移动端连接保活 ──────────────────────────────
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        for (const tab of tabs) {
          if (!tab.socket.connected) tab.socket.connect();
          else tab.socket.emit('join', tab.sessionId);
        }
      }
    });
    window.addEventListener('online', () => {
      for (const tab of tabs) { if (!tab.socket.connected) tab.socket.connect(); }
    });
    setInterval(() => {
      if (!document.hidden) {
        for (const tab of tabs) { if (!tab.socket.connected) tab.socket.connect(); }
      }
    }, 15000);

    // ── 快捷键发送到当前 tab ──
    const SEQ = {
      'ctrl-c': '\x03', 'ctrl-d': '\x04', 'tab': '\t',
      'up': '\x1b[A', 'down': '\x1b[B', 'right': '\x1b[C', 'left': '\x1b[D',
      'esc': '\x1b',
      'ctrl-a': '\x01', 'ctrl-e': '\x05', 'ctrl-k': '\x0b',
      'ctrl-u': '\x15', 'ctrl-r': '\x12', 'alt-.': '\x1b.',
    };

    document.querySelectorAll('.sk').forEach(btn => {
      const send = () => {
        const tab = tabs.find(t => t.id === activeTabId);
        if (!tab) return;
        const seq = SEQ[btn.dataset.send] || btn.dataset.send;
        tab.socket.emit('input', seq);
        tab.term.focus();
      };
      btn.addEventListener('touchend', (e) => { e.preventDefault(); send(); });
      btn.addEventListener('click', send);
    });

    // ── QR modal ──
    function showQR() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab) return;
      document.getElementById('qr-img').src = `/qr/${tab.sessionId}`;
      document.getElementById('qr-modal').classList.add('open');
    }
    function closeQR() {
      document.getElementById('qr-modal').classList.remove('open');
    }
    document.getElementById('qr-modal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeQR();
    });

    function goBack() { window.location.href = '/'; }

    // ── Photo upload ──
    const MAX_PX = 1920, QUALITY = 0.85;

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let { width: w, height: h } = img;
          if (w > MAX_PX || h > MAX_PX) {
            if (w >= h) { h = Math.round(h * MAX_PX / w); w = MAX_PX; }
            else        { w = Math.round(w * MAX_PX / h); h = MAX_PX; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(
            blob => blob ? resolve(blob) : reject(new Error('canvas toBlob failed')),
            'image/jpeg', QUALITY
          );
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    function openCamera() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async () => {
        const file = input.files?.[0];
        if (!file) return;
        const tab = tabs.find(t => t.id === activeTabId);
        if (!tab) return;

        const btn = document.getElementById('btn-photo');
        btn.textContent = '⏳';
        btn.disabled = true;

        try {
          const compressed = await compressImage(file);
          const form = new FormData();
          form.append('image', compressed, 'photo.jpg');
          const res  = await fetch('/upload?sessionId=' + tab.sessionId, { method: 'POST', body: form });
          const data = await res.json();
          if (data.path) {
            tab.socket.emit('input', data.path);
            tab.term.focus();
          } else {
            alert('上传失败: ' + (data.error || '未知'));
          }
        } catch (e) {
          alert('出错: ' + e.message);
        } finally {
          btn.textContent = '📷';
          btn.disabled = false;
        }
      };
      input.click();
    }

    // ── 文件管理 ──────────────────────────────────────
    let fpCurrentPath = '';
    let fpSessionId = null;

    function openFilePanel() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab) return;
      fpSessionId = tab.sessionId;
      fpCurrentPath = '';
      loadFiles();
      document.getElementById('file-panel').classList.add('open');
      document.getElementById('file-panel-backdrop').classList.add('open');
    }
    function closeFilePanel() {
      document.getElementById('file-panel').classList.remove('open');
      document.getElementById('file-panel-backdrop').classList.remove('open');
    }

    async function loadFiles() {
      if (!fpSessionId) return;
      const list = document.getElementById('fp-list');
      list.innerHTML = '<div class="fp-empty">加载中...</div>';
      try {
        const r = await fetch(`/api/files/${fpSessionId}?path=${encodeURIComponent(fpCurrentPath)}`);
        const data = await r.json();
        if (!data.ok) { list.innerHTML = `<div class="fp-empty">${esc(data.error)}</div>`; return; }
        document.getElementById('fp-path').textContent = data.cwd + (data.path ? '/' + data.path : '');
        if (!data.entries.length && data.parent == null) {
          list.innerHTML = '<div class="fp-empty">空目录</div>';
          return;
        }
        let html = '';
        if (data.parent != null) {
          html += `<div class="fp-item" onclick="fpNav('${jsq(data.parent)}')"><span class="fp-icon">📁</span><span class="fp-name">..</span></div>`;
        }
        for (const e of data.entries) {
          const rel = fpCurrentPath ? fpCurrentPath + '/' + e.name : e.name;
          if (e.isDir) {
            html += `<div class="fp-item" onclick="fpNav('${jsq(rel)}')"><span class="fp-icon">📁</span><span class="fp-name">${esc(e.name)}</span></div>`;
          } else {
            html += `<div class="fp-item">
              <span class="fp-icon">📄</span>
              <span class="fp-name">${esc(e.name)}</span>
              <span class="fp-size">${formatSize(e.size)}</span>
              <a class="fp-dl" href="/api/files/${fpSessionId}/download?path=${encodeURIComponent(rel)}" download title="下载">下载</a>
            </div>`;
          }
        }
        list.innerHTML = html;
      } catch (e) {
        list.innerHTML = `<div class="fp-empty">加载失败: ${esc(e.message)}</div>`;
      }
    }

    function fpNav(path) { fpCurrentPath = path; loadFiles(); }

    function formatSize(bytes) {
      if (bytes == null) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 / 1024 / 1024).toFixed(1) + ' GB';
    }

    function fpUploadClick() { document.getElementById('fp-file-input').click(); }

    document.getElementById('fp-file-input').addEventListener('change', (e) => {
      if (e.target.files.length) fpUploadFiles(e.target.files);
      e.target.value = '';
    });

    async function fpUploadFiles(files) {
      if (!fpSessionId || !files.length) return;
      const progress = document.getElementById('fp-progress');
      progress.style.display = 'block';
      progress.textContent = `正在上传 ${files.length} 个文件...`;
      try {
        const form = new FormData();
        for (const f of files) form.append('files', f, f.webkitRelativePath || f.name);
        const r = await fetch(`/api/files/${fpSessionId}/upload?path=${encodeURIComponent(fpCurrentPath)}`, {
          method: 'POST', body: form,
        });
        const data = await r.json();
        if (data.ok) {
          progress.textContent = `已上传 ${data.files.length} 个文件`;
          loadFiles();
        } else {
          progress.textContent = '上传失败: ' + (data.error || '未知错误');
        }
      } catch (e) {
        progress.textContent = '上传出错: ' + e.message;
      }
      setTimeout(() => { progress.style.display = 'none'; }, 3000);
    }

    // 拖拽上传
    const fpDrop = document.getElementById('fp-drop');
    fpDrop.addEventListener('dragover', (e) => { e.preventDefault(); fpDrop.classList.add('dragover'); });
    fpDrop.addEventListener('dragleave', () => fpDrop.classList.remove('dragover'));
    fpDrop.addEventListener('drop', (e) => {
      e.preventDefault();
      fpDrop.classList.remove('dragover');
      if (e.dataTransfer.files.length) fpUploadFiles(e.dataTransfer.files);
    });

    // ── 文件同步（File System Access API）──────────
    let syncDirHandle = null;
    let syncMode = false;
    let syncDiff = { toDownload: [], toUpload: [] };

    async function fpStartSync() {
      if (!window.showDirectoryPicker) {
        alert('当前浏览器不支持文件夹访问，请使用 Chrome 或 Edge');
        return;
      }
      if (!syncDirHandle) {
        await fpPickDir();
        if (!syncDirHandle) return;
      }
      syncMode = true;
      document.getElementById('fp-sync-bar').style.display = 'flex';
      document.getElementById('fp-drop').style.display = 'none';
      await fpComputeDiff();
    }

    async function fpPickDir() {
      try {
        syncDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        document.getElementById('fp-sync-dir').textContent = syncDirHandle.name;
        if (syncMode) await fpComputeDiff();
      } catch (e) {
        if (e.name !== 'AbortError') alert('选择文件夹失败: ' + e.message);
      }
    }

    function fpExitSync() {
      syncMode = false;
      document.getElementById('fp-sync-bar').style.display = 'none';
      document.getElementById('fp-diff-actions').style.display = 'none';
      document.getElementById('fp-drop').style.display = '';
      loadFiles();
    }

    async function walkLocalDir(dirHandle, prefix) {
      const files = [];
      for await (const [name, handle] of dirHandle.entries()) {
        if (name.startsWith('.')) continue;
        const rel = prefix ? prefix + '/' + name : name;
        if (handle.kind === 'directory') {
          files.push(...await walkLocalDir(handle, rel));
        } else {
          const file = await handle.getFile();
          files.push({ name: rel, size: file.size, handle });
        }
      }
      return files;
    }

    async function hashFile(file) {
      const buf = await file.arrayBuffer();
      const hash = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function fpComputeDiff() {
      if (!fpSessionId || !syncDirHandle) return;
      const list = document.getElementById('fp-list');
      list.innerHTML = '<div class="fp-empty">正在比对文件...</div>';
      const progress = document.getElementById('fp-progress');
      progress.style.display = 'block';

      try {
        progress.textContent = '获取服务器文件清单...';
        const r = await fetch(`/api/files/${fpSessionId}/manifest?path=${encodeURIComponent(fpCurrentPath)}`);
        const manifest = await r.json();
        if (!manifest.ok) throw new Error(manifest.error);

        progress.textContent = '扫描本地文件...';
        const localFiles = await walkLocalDir(syncDirHandle, '');

        const serverMap = new Map(manifest.files.map(f => [f.name, f]));
        const localMap = new Map(localFiles.map(f => [f.name, f]));

        const toDownload = [];
        const toUpload = [];

        let checked = 0;
        for (const [name, sf] of serverMap) {
          checked++;
          if (checked % 20 === 0) progress.textContent = `比对中... ${checked}/${serverMap.size + localMap.size}`;
          const lf = localMap.get(name);
          if (!lf) {
            toDownload.push({ name, size: sf.size, reason: 'new' });
          } else if (lf.size !== sf.size) {
            toDownload.push({ name, size: sf.size, reason: 'changed' });
          } else if (sf.hash && sf.size < 10 * 1024 * 1024) {
            const file = await lf.handle.getFile();
            const localHash = await hashFile(file);
            if (localHash !== sf.hash) toDownload.push({ name, size: sf.size, reason: 'changed' });
          }
        }
        for (const [name, lf] of localMap) {
          checked++;
          if (checked % 20 === 0) progress.textContent = `比对中... ${checked}/${serverMap.size + localMap.size}`;
          const sf = serverMap.get(name);
          if (!sf) {
            toUpload.push({ name, size: lf.size, reason: 'new', handle: lf.handle });
          } else if (lf.size !== sf.size) {
            toUpload.push({ name, size: lf.size, reason: 'changed', handle: lf.handle });
          } else if (sf.hash && lf.size < 10 * 1024 * 1024) {
            const file = await lf.handle.getFile();
            const localHash = await hashFile(file);
            if (localHash !== sf.hash) toUpload.push({ name, size: lf.size, reason: 'changed', handle: lf.handle });
          }
        }

        syncDiff = { toDownload, toUpload };
        fpRenderDiff();
      } catch (e) {
        list.innerHTML = `<div class="fp-empty">比对失败: ${esc(e.message)}</div>`;
      }
      progress.style.display = 'none';
    }

    function fpRenderDiff() {
      const { toDownload, toUpload } = syncDiff;
      const list = document.getElementById('fp-list');

      if (!toDownload.length && !toUpload.length) {
        list.innerHTML = '<div class="fp-diff-summary">文件已同步，无差异</div>';
        document.getElementById('fp-diff-actions').style.display = 'none';
        return;
      }

      let html = '<div class="fp-diff-summary">';
      if (toDownload.length) html += `${toDownload.length} 个文件需下载到本地`;
      if (toDownload.length && toUpload.length) html += '，';
      if (toUpload.length) html += `${toUpload.length} 个文件需上传到服务器`;
      html += '</div>';

      for (const f of toDownload) {
        html += `<div class="fp-diff-item">
          <span class="badge ${f.reason === 'new' ? 'badge-new' : 'badge-changed'}">${f.reason === 'new' ? '新' : '改'}</span>
          <span class="badge-arrow">↓</span>
          <span class="fp-diff-name">${esc(f.name)}</span>
          <span class="fp-size">${formatSize(f.size)}</span>
        </div>`;
      }
      for (const f of toUpload) {
        html += `<div class="fp-diff-item">
          <span class="badge ${f.reason === 'new' ? 'badge-new' : 'badge-changed'}">${f.reason === 'new' ? '新' : '改'}</span>
          <span class="badge-arrow">↑</span>
          <span class="fp-diff-name">${esc(f.name)}</span>
          <span class="fp-size">${formatSize(f.size)}</span>
        </div>`;
      }

      list.innerHTML = html;
      document.getElementById('fp-diff-actions').style.display = toDownload.length || toUpload.length ? 'flex' : 'none';
    }

    async function fpSyncToLocal() {
      const { toDownload } = syncDiff;
      if (!toDownload.length) return;
      const progress = document.getElementById('fp-progress');
      progress.style.display = 'block';
      let done = 0;
      for (const f of toDownload) {
        progress.textContent = `下载中 ${++done}/${toDownload.length}: ${f.name}`;
        try {
          const relPath = fpCurrentPath ? fpCurrentPath + '/' + f.name : f.name;
          const r = await fetch(`/api/files/${fpSessionId}/download?path=${encodeURIComponent(relPath)}`);
          if (!r.ok) continue;
          const blob = await r.blob();
          const parts = f.name.split('/');
          let dir = syncDirHandle;
          for (let i = 0; i < parts.length - 1; i++) {
            dir = await dir.getDirectoryHandle(parts[i], { create: true });
          }
          const fileHandle = await dir.getFileHandle(parts[parts.length - 1], { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(blob);
          await writable.close();
        } catch (e) { console.error(`同步下载失败 ${f.name}:`, e); }
      }
      progress.textContent = `已下载 ${done} 个文件到本地`;
      setTimeout(() => { progress.style.display = 'none'; }, 3000);
      await fpComputeDiff();
    }

    async function fpSyncToServer() {
      const { toUpload } = syncDiff;
      if (!toUpload.length) return;
      const progress = document.getElementById('fp-progress');
      progress.style.display = 'block';
      const BATCH = 20;
      let done = 0;
      for (let i = 0; i < toUpload.length; i += BATCH) {
        const batch = toUpload.slice(i, i + BATCH);
        progress.textContent = `上传中 ${done}/${toUpload.length}...`;
        const form = new FormData();
        for (const f of batch) {
          try { form.append('files', await f.handle.getFile(), f.name); }
          catch (e) { console.error(`读取本地文件失败 ${f.name}:`, e); }
        }
        try {
          await fetch(`/api/files/${fpSessionId}/upload?path=${encodeURIComponent(fpCurrentPath)}`, {
            method: 'POST', body: form,
          });
        } catch (e) { console.error('上传批次失败:', e); }
        done += batch.length;
      }
      progress.textContent = `已上传 ${done} 个文件到服务器`;
      setTimeout(() => { progress.style.display = 'none'; }, 3000);
      await fpComputeDiff();
    }

    // 监听文件变更通知
    function setupFileChangeListener() {
      const tab = tabs[0];
      if (!tab) return;
      tab.socket.on('files:changed', ({ sessionId }) => {
        if (sessionId === fpSessionId && document.getElementById('file-panel').classList.contains('open')) {
          if (syncMode) fpComputeDiff();
          else loadFiles();
        }
      });
    }

    // ── 初始化：打开 URL 中指定的会话 ──
    const initTab = createTab(INIT_SESSION_ID);
    switchTab(initTab.id);
    setupFileChangeListener();
  </script>
</body>
