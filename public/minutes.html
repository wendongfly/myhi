<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.png">
  <title>语音 · myhi</title>
  <script src="/theme.js"></script>
  <script src="/lib/machine.js"></script>
  <script src="/lib/icons.js"></script>
  <script>
    (function(){try{var t=localStorage.getItem('myhi_theme')||window.MYHI_DEFAULT_THEME||'dark',f=localStorage.getItem('myhi_font')||'medium',r=document.documentElement;if(t&&t!=='dark')r.setAttribute('data-theme',t);r.setAttribute('data-font',f);}catch(e){}})();
  </script>
  <style>
    :root {
      --bg:#0d1117; --surface:#161b22; --surface2:#1c2128; --border:#21262d; --border2:#30363d;
      --text:#e6edf3; --text2:#b1bac4; --muted:#8b949e; --dim:#6e7681;
      --accent:#7c3aed; --red:#f85149; --green:#3fb950; --yellow:#d29922; --orange:#f0883e; --blue:#58a6ff;
    }
    :root[data-theme="light"] { --bg:#ffffff; --surface:#f6f8fa; --surface2:#eef1f4; --border:#d0d7de; --border2:#d0d7de;
      --text:#1f2328; --text2:#57606a; --muted:#656d76; --dim:#818b98;
      --accent:#8250df; --red:#cf222e; --green:#1a7f37; --yellow:#9a6700; --orange:#bc4c00; --blue:#0969da; }
    :root[data-theme="black"] { --bg:#000000; --surface:#0a0a0a; --surface2:#111; --border:#161616; --border2:#262626; }
    @media (prefers-color-scheme: light) { :root[data-theme="system"] { --bg:#ffffff; --surface:#f6f8fa; --surface2:#eef1f4; --border:#d0d7de; --border2:#d0d7de;
      --text:#1f2328; --text2:#57606a; --muted:#656d76; --dim:#818b98;
      --accent:#8250df; --red:#cf222e; --green:#1a7f37; --yellow:#9a6700; --orange:#bc4c00; --blue:#0969da; } }
    html { font-size: 16px; } html[data-font="small"]{font-size:15px;} html[data-font="medium"]{font-size:17px;} html[data-font="large"]{font-size:19.5px;}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 0.85rem; line-height: 1.6; }
    a { color: var(--blue); text-decoration: none; cursor: pointer; }
    #hd { display: flex; align-items: center; gap: 0.6rem; padding: max(0.6rem, env(safe-area-inset-top)) 1rem 0.6rem; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5; }
    #hd .back { color: var(--muted); }
    html { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    ::-webkit-scrollbar-track { background: transparent; }
    /* 嵌在首页工作台（?embed=ws）：页头去掉，左栏顶部放导航、底部「用户 + ⚙」（同任务栏），两栏铺满、各自滚动 */
    .emb-only { display: none; }
    body.embed .emb-only { display: block; }
    body.embed { height: 100vh; overflow: hidden; }
    body.embed #hd { display: none; }
    body.embed #wrap { max-width: none; height: 100vh; padding: 0; gap: 0; grid-template-columns: 360px 1fr; }
    body.embed #lcol { height: 100vh; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--border); min-width: 0; }
    body.embed #emb-nav { flex-shrink: 0; padding: 0.75rem 0.75rem 0; }
    body.embed #lscroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0.75rem 1.2rem; scrollbar-width: thin; }
    body.embed #emb-foot { display: flex; align-items: center; gap: 0.4rem; padding: 0.55rem 0.6rem 0.6rem 0.9rem; }
    #emb-user { flex: 1; min-width: 0; font-size: 0.8rem; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #emb-set { background: none; border: none; color: var(--text2); font-size: 1.05rem; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; }
    #emb-set:hover { background: var(--bg); color: var(--text); }
    body.embed #wrap > div:first-child .card { background: var(--bg); padding: 0.8rem; }
    body.embed #result { height: 100vh; overflow-y: auto; scrollbar-width: thin; border: none; border-radius: 0; background: var(--bg); padding: 1rem 1.4rem; }
    #emb-nav .top { display: flex; align-items: center; margin: 0.05rem 0.2rem 0.6rem; }
    #emb-nav .logo { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text); text-decoration: none; }
    #emb-nav .logo span { color: var(--accent); }
    #emb-nav .gear { margin-left: auto; background: none; border: none; color: var(--text2); font-size: 1rem; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; }
    #emb-nav .gear:hover { background: var(--bg); color: var(--text); }
    #emb-nav .nav3 { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 0.75rem; }
    #emb-nav .nav3 button { flex: 1; background: none; border: none; border-radius: 7px; color: var(--text2); font: inherit; font-size: 0.8rem; padding: 0.42rem 0.2rem; cursor: pointer; white-space: nowrap; }
    #emb-nav .nav3 button:hover { color: var(--text); }
    #emb-nav .nav3 button.on { background: var(--accent); color: #fff; font-weight: 600; }
    #hd h1 { font-size: 1rem; font-weight: 600; }
    #wrap { display: grid; grid-template-columns: 360px 1fr; gap: 1rem; padding: 1rem; max-width: 1400px; margin: 0 auto; align-items: start; }
    @media (max-width: 860px) { #wrap { grid-template-columns: 1fr; padding: 0.75rem; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem; }
    .card + .card { margin-top: 0.8rem; }
    .lbl { display: block; font-weight: 600; margin: 0.7rem 0 0.3rem; font-size: 0.82rem; }
    .lbl:first-child { margin-top: 0; }
    .lbl small { font-weight: 400; color: var(--muted); margin-left: 0.3rem; }
    textarea, input[type=text], input[type=date], select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border2); border-radius: 8px; padding: 0.5rem 0.6rem; font: inherit; outline: none; }
    textarea:focus, input:focus, select:focus { border-color: var(--accent); }
    .file { border: 1.5px dashed var(--border2); border-radius: 10px; padding: 0.9rem; text-align: center; cursor: pointer; color: var(--muted); }
    .file:hover, .file.drag { border-color: var(--accent); color: var(--text); }
    .file b { color: var(--text); }
    .go { width: 100%; margin-top: 0.9rem; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0.7rem; font: inherit; font-weight: 600; font-size: 0.92rem; cursor: pointer; }
    .go:disabled { opacity: 0.55; cursor: default; }
    .bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-top: 0.5rem; }
    .bar > div { height: 100%; background: var(--accent); width: 0; transition: width 0.3s; }
    .hint { font-size: 0.72rem; color: var(--muted); margin-top: 0.5rem; line-height: 1.6; }
    .warn { color: var(--yellow); } .err { color: var(--red); } .ok { color: var(--green); }
    .empty { color: var(--muted); text-align: center; padding: 2.5rem 1rem; }
    .btn { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: 8px; padding: 0.3rem 0.7rem; font: inherit; font-size: 0.78rem; cursor: pointer; white-space: nowrap; }
    .btn:hover { border-color: var(--accent); }
    .btn.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    #job-hd { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
    #job-hd b { font-size: 1rem; }
    #job-hd .meta { color: var(--muted); font-size: 0.75rem; }
    .steps { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; margin: 0.6rem 0; font-size: 0.78rem; }
    .step { padding: 0.15rem 0.6rem; border-radius: 12px; border: 1px solid var(--border2); color: var(--muted); }
    .step.done { color: var(--green); border-color: var(--green); }
    .step.on { color: #fff; background: var(--accent); border-color: var(--accent); }
    .step.bad { color: var(--red); border-color: var(--red); }
    .spk { display: grid; grid-template-columns: 140px 1fr; gap: 0.3rem 0.6rem; align-items: center; margin-top: 0.5rem; }
    .spk .dot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-right: 0.3rem; vertical-align: middle; }
    .spk small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tabs { display: flex; gap: 0.2rem; border-bottom: 1px solid var(--border); margin: 0.8rem 0 0.6rem; }
    .tabs button { background: none; border: none; color: var(--muted); padding: 0.4rem 0.8rem; font: inherit; cursor: pointer; border-bottom: 2px solid transparent; }
    .tabs button.on { color: var(--text); border-color: var(--accent); font-weight: 600; }
    .acts { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.6rem; align-items: center; }
    .lbl2 { font-size: 0.8rem; font-weight: 600; margin: 0.7rem 0 0.3rem; }
    .lbl2 small { font-weight: 400; color: var(--muted); margin-left: 0.3rem; }
    /* 纪要版本切换 */
    .vers { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .vchip { background: var(--surface2); border: 1px solid var(--border2); color: var(--text2); border-radius: 14px; padding: 0.2rem 0.7rem; font: inherit; font-size: 0.78rem; cursor: pointer; }
    .vchip small { color: var(--muted); margin-left: 0.25rem; }
    .vchip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .vchip.on small { color: rgba(255,255,255,0.8); }
    .vmeta { font-size: 0.74rem; color: var(--muted); line-height: 1.6; margin-bottom: 0.5rem; white-space: pre-wrap; }
    .md { line-height: 1.75; }
    .md h1 { font-size: 1.25rem; margin: 0.4rem 0 0.6rem; } .md h2 { font-size: 1.05rem; margin: 1rem 0 0.4rem; padding-bottom: 0.2rem; border-bottom: 1px solid var(--border); } .md h3 { font-size: 0.95rem; margin: 0.8rem 0 0.3rem; }
    .md p { margin: 0.4rem 0; } .md ul, .md ol { padding-left: 1.4rem; margin: 0.3rem 0; }
    .md table { border-collapse: collapse; margin: 0.5rem 0; width: 100%; font-size: 0.8rem; } .md th, .md td { border: 1px solid var(--border2); padding: 0.3rem 0.5rem; text-align: left; vertical-align: top; } .md th { background: var(--surface2); }
    .md code { background: var(--surface2); padding: 0 0.25rem; border-radius: 4px; }
    #mtext { min-height: 60vh; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; line-height: 1.6; }
    /* 嵌入时结果区自己滚、有 1rem 上内边距：吸顶要盖住这条缝，不然上面露半行字（未吸顶时总间距不变）*/
    body.embed #player { top: -1rem; padding-top: 1.4rem; margin-top: -0.4rem; }
    .tr { margin: 0.45rem 0; scroll-margin-top: calc(var(--stick-top, 0px) + var(--plh, 60px) + 8px); scroll-margin-bottom: 1rem; }   /* 跟随滚动时别钻到吸顶播放器底下 */
    .tr .w { font-weight: 600; margin-right: 0.3rem; }
    .tr .t { color: var(--muted); font-size: 0.72rem; margin-right: 0.3rem; font-variant-numeric: tabular-nums; }
    .tr.seek { cursor: pointer; border-radius: 6px; padding: 0.15rem 0.35rem; margin-left: -0.35rem; }
    .tr.seek:hover { background: var(--bg2, rgba(127,127,127,0.08)); }
    .tr.seek .t { color: var(--accent, #3b82f6); text-decoration: underline dotted; }
    .tr.cur { background: rgba(59,130,246,0.12); }
    /* 播放器吸顶：逐字稿 / 纪要在它下面滚，跟随播放滚动时也不会把它滚走。
       --stick-top：单独打开 / 手机是整页滚动，贴在吸顶页头下面；嵌在工作台里是结果区自己滚，贴顶（JS 量出来） */
    #player { display: flex; align-items: center; gap: 0.5rem; margin: 0.6rem 0 0.2rem; flex-wrap: wrap;
      position: sticky; top: var(--stick-top, 0px); z-index: 3; background: inherit; padding: 0.4rem 0.4rem; margin-left: -0.4rem; margin-right: -0.4rem;   /* 左右各多盖 0.4rem：逐字稿行（.tr.seek）往左伸 0.35rem */
      box-shadow: 0 8px 8px -8px rgba(0,0,0,0.35); }
    #player audio { flex: 1; min-width: 240px; height: 36px; }
    #player small { color: var(--muted); }
    #hist .h { display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.4rem; border-top: 1px solid var(--border); cursor: pointer; border-radius: 6px; }
    #hist .h .x { min-width: 0; flex: 1; }
    #hist .h:first-child { border-top: none; }
    #hist .h:hover, #hist .h.on { background: var(--surface2); }
    #hist .h div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #hist .h small { color: var(--muted); }
    /* 历史：每条右侧 🗑（悬停显示，触屏常显）；「管理」模式多选删除 / 清空 */
    #hist .hsel { display: none; flex-shrink: 0; margin: 0; }
    #hist.man .hsel { display: inline-block; }
    #hist .hdel { flex-shrink: 0; opacity: 0; cursor: pointer; padding: 0.15rem 0.3rem; border-radius: 5px; color: var(--muted); font-size: 0.85rem; }
    #hist .h:hover .hdel { opacity: 1; }
    #hist .hdel:hover { background: var(--bg); color: var(--red); }
    @media (hover: none) { #hist .hdel { opacity: 0.7; } }
    #hist.man .hdel { display: none; }
    #hist-bar { display: none; gap: 0.4rem; align-items: center; flex-wrap: wrap; margin: 0.2rem 0 0.4rem; font-size: 0.75rem; }
    #hist-bar button { background: none; border: 1px solid var(--border); color: var(--text2); border-radius: 6px; padding: 0.2rem 0.55rem; cursor: pointer; font: inherit; }
    #hist-bar button.danger { color: var(--red); border-color: var(--red); }
    #hist-bar button:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
<script>if (new URLSearchParams(location.search).get('embed')) document.body.classList.add('embed');</script>
  <div id="hd"><a class="back" href="/">‹ myhi</a><h1 data-ico>🎤 语音 <span style="font-weight:400;color:var(--muted);font-size:0.85rem">· 会议纪要</span></h1></div>
  <div id="wrap">
    <div id="lcol"><div id="emb-nav" class="emb-only">
        <div class="top"><a class="logo" onclick="navTo('tasks')" style="cursor:pointer">my<span>hi</span></a></div>
        <div class="nav3"><button data-ico onclick="navTo('tasks')">💬 任务</button><button data-ico onclick="navTo('studio')">🖼 出图</button><button data-ico class="on">🎤 语音</button></div>
      </div><div id="lscroll">
      <div class="card">
        <label class="lbl" for="title" style="margin-top:0">会议名称</label>
        <input type="text" id="title" placeholder="例如：双十一活动筹备会">
        <label class="lbl" for="mdate">会议时间</label>
        <input type="date" id="mdate">
        <label class="lbl">会议录音</label>
        <div class="file" id="drop" onclick="$('file').click()"><b>点这里选录音文件</b>，或拖进来<br><small>mp3、m4a、wav、aac、amr、webm、mp4 等，最大 1GB</small><small id="drop-mob" style="display:none"><br>手机上：点这里后选「文件」，在文件管理里找录音机录好的录音（一般是 m4a）。不要选「录音机」现场录——那样录出来是电话音质的 amr，转写效果差</small></div>
        <input type="file" id="file" accept="audio/*,video/mp4,video/webm,.m4a,.amr,.mp3,.wav,.aac" style="display:none">
        <div id="fname" class="hint"></div>
        <button class="go" id="go" onclick="upload()">上传并识别</button>
        <div id="up" style="display:none"><div class="bar"><div></div></div><div class="hint" id="up-t"></div></div>
        <div class="hint" id="cfg-hint"></div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;margin-bottom:0.3rem"><b>历史</b><a id="hist-man" style="margin-left:auto;font-size:0.75rem;cursor:pointer" onclick="histManage(!$('hist').classList.contains('man'))">管理</a><a style="margin-left:0.8rem;font-size:0.75rem;cursor:pointer" onclick="loadHistory()">刷新</a></div><div id="hist-bar"><button onclick="histSelAll()">全选</button><button id="hist-delsel" class="danger" onclick="histDelSel()" disabled>删除所选</button><button class="danger" style="margin-left:auto" onclick="histClear()">清空全部</button></div>
        <div id="hist"><div class="empty" style="padding:1rem">还没有整理过会议</div></div>
      </div>
    </div>
    <div id="emb-foot" class="emb-only"><span id="emb-user" data-ico>👤 本机</span><button id="emb-set" onclick="openMenu(event)" title="设置与更多">⚙</button></div></div>
    <div class="card" id="result"><div class="empty">左边填上会议名称、选好录音，点「上传并识别」。<br>先转写成文字并区分发言人；识别完在这里改发言人名字、写整理要求，再生成纪要——可以换要求生成多版，挑想要的保存。</div></div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  // 嵌在首页工作台时：左栏导航 / ⚙ 交给首页切换（同源 postMessage）；单独打开时就是普通链接
  // 底部 ⚙：让首页在这个按钮上方弹出和任务栏同一个「设置与更多」菜单；在本页点别处 / Esc 就收起
  window.openMenu = (e) => {
    e.stopPropagation();
    const r = e.currentTarget.getBoundingClientRect();
    if (window.parent !== window) window.parent.postMessage({ type: 'myhi-nav', to: 'menu', rect: { left: r.left, right: r.right, top: r.top, bottom: r.bottom } }, location.origin);
  };
  if (window.parent !== window) {
    const closeMenu = () => window.parent.postMessage({ type: 'myhi-nav', to: 'menu-close' }, location.origin);
    document.addEventListener('mousedown', (e) => { if (!e.target.closest('#emb-set')) closeMenu(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
    try { const u = window.parent.document.getElementById('ws-user')?.textContent.replace(/^[^\p{L}\p{N}]+/u, '').trim(); if (u) document.getElementById('emb-user').textContent = '👤 ' + u; } catch {}
  }
  window.navTo = (to) => {
    if (document.body.classList.contains('embed') && window.parent !== window) return window.parent.postMessage({ type: 'myhi-nav', to }, location.origin);
    location.href = to === 'studio' ? '/studio' : to === 'voice' ? '/minutes' : '/';
  };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const COLORS = ['#7c3aed', '#0969da', '#1a7f37', '#bc4c00', '#cf222e', '#8a6d00', '#6639ba', '#0e7490'];
  let CFG = null, CUR = null, POLL = null, TAB = 'minutes', EDIT = false, FILE = null;
  // 原录音播放器：只建一个，每次重绘把它挪回新位置（同一轮里挪回去不会打断播放）
  const AUD = document.createElement('audio'); AUD.controls = true; AUD.preload = 'metadata';
  let AUD_JOB = null;
  // 吸顶位置：页头高度（嵌入时没有页头 → 0）+ 播放器自身高度（给逐字稿留出避让）
  function setStickVars() {
    const r = document.documentElement.style;
    const hd = document.getElementById('hd');
    r.setProperty('--stick-top', (document.body.classList.contains('embed') || !hd || getComputedStyle(hd).display === 'none' ? 0 : hd.offsetHeight) + 'px');
    const pl = document.getElementById('player');
    if (pl) r.setProperty('--plh', pl.offsetHeight + 'px');
  }
  addEventListener('resize', setStickVars);
  // 播不了（浏览器不支持的格式且服务端也转不了，如 wma / AMR-WB）：藏起播放器，给出原因 + 下载原录音
  let AUD_ERR = null;   // { id, html }：轮询重绘后保持
  const audUrl = (id) => '/api/minutes/jobs/' + encodeURIComponent(id) + '/audio';
  function showAudErr() {
    const box = document.getElementById('pl-err');
    const on = !!(AUD_ERR && CUR && AUD_ERR.id === CUR.id);
    AUD.style.display = on ? 'none' : '';
    if (box) { box.style.display = on ? '' : 'none'; if (on) box.innerHTML = AUD_ERR.html; }
  }
  AUD.addEventListener('error', async () => {
    const id = AUD_JOB; if (!id) return;
    let why = '';
    try { const r = await fetch(audUrl(id)); if (!r.ok) why = (await r.json()).error || ''; } catch {}
    const ext = ((CUR && CUR.id === id && CUR.audio?.file) || '').split('.').pop().toLowerCase();

  function md(src) {
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
    const lines = String(src || '').split('\n'); let html = '', i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (/^\s*$/.test(l)) { i++; continue; }
      let m;
      if ((m = /^(#{1,3})\s+(.*)$/.exec(l))) { html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
      if (/^\s*\|/.test(l)) {
        const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
        const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
        html += '<table>' + body.map((r, k) => '<tr>' + cells(r).map((c) => k === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</table>';
        continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
        const ol = /^\s*\d+\./.test(l), items = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ''));
        html += `<${ol ? 'ol' : 'ul'}>` + items.map((x) => `<li>${inline(x)}</li>`).join('') + `</${ol ? 'ol' : 'ul'}>`;
        continue;
      }
      const para = []; while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|\s*\||\s*([-*]|\d+\.)\s)/.test(lines[i])) para.push(lines[i++]);
      html += `<p>${para.map(inline).join('<br>')}</p>`;
    }
    return html;
  }

  };
  window.delV = async () => {
    const v = curV(); if (!v || !confirm(`删除第 ${v.n} 版纪要？不可恢复（已保存到项目里的文件不受影响）。`)) return;
    const d = await post('/versions/' + encodeURIComponent(v.id), null, 'DELETE');
    if (!d.ok) return alert('删除失败：' + d.error);
    VSEL = null; EDIT = false; showJob(d.job); loadHistory();
  };
  window.retrans = async () => {
    const n = prompt('会上有几位发言人？填数字，区分会更准（留空 = 自动判断）：', CUR.spkNum || '');
    if (n === null) return;
    if (n.trim() && !/^\d{1,2}$/.test(n.trim())) return alert('请填 1～20 的数字');
    if (!confirm('重新识别会替换现在的逐字稿和发言人（已整理的纪要保留）。确定？')) return;
    const d = await post('/retranscribe', { spkNum: n.trim() });
    if (!d.ok) return alert(d.error);
    DRAFT = null; TAB = 'tr'; showJob(d.job); loadHistory();
  };
  window.saveEdit = async () => {
    const v = curV(); const markdown = $('mtext').value;
    const d = await post('/minutes', { versionId: v.id, markdown }, 'PUT');
    if (!d.ok) return alert('保存失败：' + d.error);
    v.markdown = markdown; v.editedAt = new Date().toISOString(); EDIT = false; showJob(CUR);
  };
  window.copyMinutes = async () => { try { await navigator.clipboard.writeText(curV()?.markdown || ''); alert('已复制这一版纪要'); } catch { alert('复制失败，请用「下载 .md」'); } };
  window.cancelJob = async () => { await post('/cancel'); refresh(CUR.id); };
  window.saveProject = async () => {
    const v = curV(), cwd = $('v-proj')?.value; if (!v || !cwd) return;
    const d = await post('/save', { cwd, versionId: v.id });
    alert(d.ok ? '已保存到：\n' + d.saved.join('\n') : '保存失败：' + d.error);
    refresh(CUR.id);
  };
  async function loadHistory() {
    const d = await api('/api/minutes/jobs').catch(() => null);
    const jobs = d?.jobs || [];
    const ST = { transcribing: '识别中', summarizing: '整理纪要中', error: '出错', cancelled: '已取消' };
    $('hist').innerHTML = jobs.length ? jobs.map((j) => `<div class="h" data-id="${esc(j.id)}" data-st="${esc(j.status)}"><div class="x"><div>${esc(j.title)}</div><small>${esc(j.meetingDate)}${j.duration ? ' · ' + fmt(j.duration) : ''}${j.speakers ? ' · ' + j.speakers + ' 人' : ''} · ${ST[j.status] || (j.versions ? j.versions + ' 版纪要' : '已识别，待整理')}</small></div></div>`).join('')
      : '<div class="empty" style="padding:1rem">还没有整理过会议</div>';
    $('hist').querySelectorAll('.h').forEach((h) => h.onclick = async () => {
      const r = await api('/api/minutes/jobs/' + encodeURIComponent(h.dataset.id)).catch(() => null);
      if (r?.ok) { TAB = null; EDIT = false; showJob(r.job); if (innerWidth <= 860) $('result').scrollIntoView({ behavior: 'smooth' }); }
    });
    if (CUR) document.querySelectorAll('#hist .h').forEach((h) => h.classList.toggle('on', h.dataset.id === CUR.id));
    histDecorate();
  }
  // ── 删除历史：单条 🗑 / 管理模式多选 / 清空（成员只删自己的，管理员能删全部；进行中的不删）──
  const RESULT0 = $('result').innerHTML;   // 删掉当前打开的那条后，右侧回到初始说明
  let HMAN = false;
  const HBUSY = ["transcribing","summarizing"];
  const histSelIds = () => [...$('hist').querySelectorAll('.hsel:checked')].map((c) => c.closest('.h').dataset.id);
  function histUpdSel() {
    const n = histSelIds().length, b = $('hist-delsel');
    b.textContent = n ? '删除所选（' + n + '）' : '删除所选'; b.disabled = !n;
  }
  function histAfterDelete(ids) {
    if (CUR && ids.includes(CUR.id)) { clearTimeout(POLL); CUR = null; $('result').innerHTML = RESULT0; }
    loadHistory();
  }
  async function histPost(body) {
    const d = await api('/api/minutes/jobs/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).catch((e) => ({ ok: false, error: e.message }));
    if (!d.ok) { alert('删除失败：' + (d.error || '未知错误')); return null; }
    if (d.busy) alert('已删除 ' + d.deleted + ' 条；还有 ' + d.busy + ' 条正在进行，没有删除（先取消再删）');
    return d;
  }
  window.histDelOne = async (ev, id) => {
    ev.stopPropagation();
    if (!confirm('删除这条纪要？录音、逐字稿和纪要会一起删掉（已保存到项目里的不受影响），不可恢复。')) return;
    const d = await api('/api/minutes/jobs/' + encodeURIComponent(id), { method: 'DELETE' }).catch((e) => ({ ok: false, error: e.message }));
    if (!d.ok) return alert('删除失败：' + (d.error || '未知错误'));
    histAfterDelete([id]);
  };
  window.histManage = (on) => {
    HMAN = on;
    $('hist').classList.toggle('man', on);
    $('hist-bar').style.display = on ? 'flex' : 'none';
    $('hist-man').textContent = on ? '完成' : '管理';
    if (!on) $('hist').querySelectorAll('.hsel').forEach((c) => { c.checked = false; });
    histUpdSel();
  };
  window.histSelAll = () => {
    const cs = [...$('hist').querySelectorAll('.hsel:not(:disabled)')];
    const all = cs.length && cs.every((c) => c.checked);
    cs.forEach((c) => { c.checked = !all; });
    histUpdSel();
  };
  window.histDelSel = async () => {
    const ids = histSelIds();
    if (!ids.length || !confirm('删除选中的 ' + ids.length + ' 条纪要？录音、逐字稿和纪要会一起删掉（已保存到项目里的不受影响），不可恢复。')) return;
    if (await histPost({ ids })) histAfterDelete(ids);
  };
  window.histClear = async () => {
    if (!confirm('清空全部纪要历史？录音、逐字稿和纪要会一起删掉（已保存到项目里的不受影响），不可恢复。\n（管理员会清掉所有成员的；正在进行的不删）')) return;
    const d = await histPost({ all: true });
    if (d) { histManage(false); histAfterDelete(CUR && !HBUSY.includes(CUR.status) ? [CUR.id] : []); }
  };
  // 每次重画列表后：给每行补上勾选框和 🗑，管理模式下点整行 = 勾选
  function histDecorate() {
    $('hist').querySelectorAll('.h').forEach((h) => {
      const busy = HBUSY.includes(h.dataset.st);
      const c = document.createElement('input'); c.type = 'checkbox'; c.className = 'hsel'; c.disabled = busy;
      c.title = busy ? '正在进行，不能删除' : '选择';
      c.onclick = (e) => e.stopPropagation(); c.onchange = histUpdSel;
      h.prepend(c);
      if (!busy) { const d = document.createElement('span'); d.className = 'hdel'; d.textContent = '🗑'; d.title = '删除'; d.onclick = (e) => histDelOne(e, h.dataset.id); h.append(d); }
      const open = h.onclick;
      h.onclick = (e) => { if (HMAN) { if (!c.disabled) { c.checked = !c.checked; histUpdSel(); } return; } open?.(e); };
    });
    histUpdSel();
  }
  loadConfig(); loadHistory();
  const q = new URLSearchParams(location.search).get('job');
  if (q) api('/api/minutes/jobs/' + encodeURIComponent(q)).then((r) => r?.ok && showJob(r.job)).catch(() => {});
</script>
</body>
</html>
